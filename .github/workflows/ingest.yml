name: Ingest

# Monthly store refresh. Each dataset resumes from its committed checkpoint and
# refetches a revision overlap; upserts on the natural key absorb restatements.

on:
  schedule:
    - cron: "40 5 1 * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Revision overlap: days refetched behind the stored checkpoint"
        required: false
        default: "7"

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Ingest
        run: gpa ingest --days ${{ github.event.inputs.days || '7' }}

      - name: Validate
        run: gpa validate

      - name: Audit gaps and overlaps
        # Before the commit: an integrity problem blocks persistence.
        run: gpa audit

      - name: Rebuild site tables
        run: gpa export

      - name: Report coverage
        run: gpa stats

      # Before the freshness check, so one quiet feed does not discard the rest.
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated site/data
          if git diff --cached --quiet; then
            echo "No new observations; nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: ingest $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check freshness
        run: gpa freshness --no-strict

      - name: Open or update an issue when the run fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled ingest did not complete.',
              '',
              `Run: ${run}`,
              '',
              'A freshness failure means a provider stopped publishing rather than',
              'that the code broke. The rule that fired names the zone, the dataset',
              'and the reason its limit is what it is.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingest-failure',
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Ingest failed on ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels: ['ingest-failure'],
              });
            }

  deploy:
    needs: ingest
    # New data ships even if the later freshness check failed.
    if: ${{ !cancelled() && needs.ingest.outputs.committed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.ingest.outputs.sha }}
