name: CI

on:
  push:
    branches: [main]
    # Ledger commits from forecast.yml change neither the site nor the store.
    paths-ignore:
      - "data/forecast_issues/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test
        # Fixtures and mocked transports only: no network, no credentials.
        run: pytest -q --cov=gpa --cov-fail-under=75

      - name: Validate the committed store
        run: gpa validate

      - name: Audit gaps and overlaps
        run: gpa audit

  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: pip install -e .
      - run: npm ci

      - name: Fail if the exported tables are stale
        run: gpa export --check

      - run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke against the local preview
        # One step: a backgrounded server does not survive into the next.
        env:
          GPA_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          npm run dev &
          server=$!
          ready=
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "preview server did not become ready"
            kill "$server" 2>/dev/null || true
            exit 1
          fi
          set +e
          npm run test:browser
          status=$?
          set -e
          kill "$server" 2>/dev/null || true
          exit $status

  deploy:
    name: Deploy
    needs: [python, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
