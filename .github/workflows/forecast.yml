name: Forecast

# Issues each delivery day before the 12:00 D-1 gate (10:00Z CEST, 11:00Z CET),
# then reconciles earlier issues against settled prices.

on:
  schedule:
    # GitHub delivers these about five hours late, so the slots are set by
    # arrival: 23:17Z lands near 05:00Z, 02:17Z near 08:00Z, 06:47Z is a
    # backstop. A slot that finds the day issued records `already_issued` and
    # passes; one that arrives after the gate with nothing on record fails.
    - cron: "17 23 * * *"
    - cron: "17 2 * * *"
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-issue
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # An isolated copy of the committed store, caught up from its checkpoint.
      GPA_DATA_ROOT: /tmp/gpa-curated
      FORECAST_MODEL: ridge
      FORECAST_COMPARATORS: "naive_previous_day naive_previous_week naive_similar_day"
      FORECAST_LOOKBACK: "7"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Register one attempt per arm before any input is read
        run: |
          ATTEMPT_ID="gh-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "ATTEMPT_ID=$ATTEMPT_ID" >> "$GITHUB_ENV"
          origin=${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'schedule' }}
          gpa forecast-attempt start --attempt-id "$ATTEMPT_ID" --zone DE-LU \
            --model "$FORECAST_MODEL" --origin "$origin"
          for model in $FORECAST_COMPARATORS; do
            gpa forecast-attempt start --attempt-id "$ATTEMPT_ID-$model" --zone DE-LU \
              --model "$model" --origin "$origin"
          done

      - name: Seed an isolated forecast store
        run: |
          mkdir -p "$GPA_DATA_ROOT"
          cp -a data/curated/. "$GPA_DATA_ROOT/"

      - name: Refresh the series an issue reads
        run: >-
          gpa ingest --zone DE-LU --days "$FORECAST_LOOKBACK"
          --dataset price --dataset load --dataset generation

      - name: Validate the isolated inputs
        run: gpa validate

      - name: Reconcile previously issued forecasts
        run: gpa reconcile --zone DE-LU

      - name: Evaluate reconciled battery dispatch
        run: gpa battery --zone DE-LU --output data/forecast_issues/evaluations

      - name: Issue the forecast
        run: gpa issue --zone DE-LU --model "$FORECAST_MODEL" --attempt-id "$ATTEMPT_ID"

      - name: Issue the naive comparators on the same inputs
        run: |
          for model in $FORECAST_COMPARATORS; do
            gpa issue --zone DE-LU --model "$model" --attempt-id "$ATTEMPT_ID-$model"
          done

      - name: Close attempts an earlier failure left open
        if: failure()
        run: |
          [ -n "$ATTEMPT_ID" ] || exit 0
          for id in "$ATTEMPT_ID" $(printf " $ATTEMPT_ID-%s" $FORECAST_COMPARATORS); do
            gpa forecast-attempt finish --attempt-id "$id" --status failed --if-open
          done

      - name: Commit the prospective ledger
        # Also after a failure, so the failed attempts are kept as evidence.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast_issues
          if git diff --cached --quiet; then
            echo "No new issue or attempt records; nothing to commit."
            exit 0
          fi
          git commit -m "forecast: DE-LU run at $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push
